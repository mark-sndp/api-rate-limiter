rate-limiter:
  # "in-memory" (default, single JVM only) or "redis" (shared state, required for horizontal scaling).
  store: ${RATE_LIMITER_STORE:in-memory}
  default-policy:
    max-requests: 60
    window-duration: 1m
  # Idle client buckets are evicted after this duration of inactivity to bound memory usage.
  bucket-eviction-duration: 1h
  customer-policies:
    customerA:
      max-requests: 100
      window-duration: 1m
    customerB:
      max-requests: 1000
      window-duration: 1m
    customerC:
      max-requests: 10
      window-duration: 1s

spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8080
